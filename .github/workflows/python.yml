name: Python worker CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install worker dependencies
        run: python -m pip install -r tools/python/requirements-worker.txt
      - name: Python unit and HTTP recovery tests
        run: python -m unittest discover -s tools/python -v
      - name: Numerical and hash parity with Go
        run: python tools/python/check_go_parity.py --repo .
      - name: Signed proof parity with Go
        run: python tools/python/check_go_proofs.py --repo .
