services:
  # ============================================================================
  # Prism Nodes (P2P Network)
  # ============================================================================
  node-1:
    image: prism-node:v0.49.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prism-node-1
    command:
      - node
      - --host
      - 0.0.0.0
      - --port
      - "7001"
    ports:
      - "7001:7001"
    volumes:
      - node1-data:/app/data
    networks:
      - prism-testnet
    restart: unless-stopped

  node-2:
    image: prism-node:v0.49.0
    container_name: prism-node-2
    command:
      - node
      - --host
      - 0.0.0.0
      - --port
      - "7002"
      - --peer
      - prism-node-1:7001
    ports:
      - "7002:7002"
    volumes:
      - node2-data:/app/data
    networks:
      - prism-testnet
    depends_on:
      node-1:
        condition: service_started
    restart: unless-stopped

  node-3:
    image: prism-node:v0.49.0
    container_name: prism-node-3
    command:
      - node
      - --host
      - 0.0.0.0
      - --port
      - "7003"
      - --peer
      - prism-node-1:7001
    ports:
      - "7003:7003"
    volumes:
      - node3-data:/app/data
    networks:
      - prism-testnet
    depends_on:
      node-1:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # Prism API Server (REST HTTP)
  # ============================================================================
  api:
    image: prism-node:v0.49.0
    container_name: prism-api
    command:
      - api
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --data
      - /app/data/node-7001
    ports:
      - "8080:8080"
    volumes:
      - node1-data:/app/data
    networks:
      - prism-testnet
    depends_on:
      node-1:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # Prism Web Explorer (Frontend)
  # ============================================================================
  explorer:
    image: nginx:alpine
    container_name: prism-explorer
    ports:
      - "80:80"
    volumes:
      - ./web/explorer:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - prism-testnet
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # Prism Compute Worker (Optional - for ML tasks)
  # ============================================================================
  worker:
    image: prism-worker:v0.49.0
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: prism-worker
    user: "100:101"
    command:
      - --api
      - http://prism-api:8080/api/v1
      - --data
      - /app/data/node-7001
      - watch
      - --worker
      - Bob
      - --poll-interval
      - "5"
      - --health
      - /app/data/node-7001/python-worker/health.json
      - --metrics-host
      - 0.0.0.0
      - --metrics-port
      - "9100"
    ports:
      - "9100:9100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, os, time
          path = "/app/data/node-7001/python-worker/health.json"
          try:
              with open(path, encoding="utf-8") as stream:
                  health = json.load(stream)
              age = time.time() - os.path.getmtime(path)
              healthy = health.get("status") == "healthy" and age <= 30
          except Exception:
              healthy = False
          raise SystemExit(0 if healthy else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    volumes:
      - node1-data:/app/data
    networks:
      - prism-testnet
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    profiles:
      - worker


  # ============================================================================
  # Prism Monitoring
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prism-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - prism-testnet
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:13.2.2
    container_name: prism-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - prism-testnet
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  node1-data:
    driver: local
  node2-data:
    driver: local
  node3-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  prism-testnet:
    driver: bridge
